name: Pairr

options:
  bundleIdPrefix: app.lrvdlinden
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"

settings:
  base:
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 4
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pairr
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  # iPhone, iPad and Mac (native macOS) — one app, universal purchase.
  Pairr:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Pairr
      - path: Shared
    info:
      path: Config/Pairr-Info.plist
      properties:
        CFBundleLocalizations: [en, nl, de, fr, es, it, sv, nb, da, pl]
        ITSAppUsesNonExemptEncryption: false
        PairrKeychainGroup: $(AppIdentifierPrefix)app.lrvdlinden.pairr.shared
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [remote-notification]
        NSUbiquitousContainers:
          iCloud.app.lrvdlinden.pairr:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Pairr
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.lrvdlinden.pairr.backup
            UTTypeDescription: Pairr backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pairrbackup]
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        NFCReaderUsageDescription: Pairr reads HomeKit and Matter NFC tags to save their pairing code.
        NSCameraUsageDescription: Pairr uses the camera to scan pairing codes and QR codes on your devices.
        NSHomeKitUsageDescription: Pairr reads your homes, rooms and accessories so you can attach pairing codes to them. Pairr never changes your home.
        NSFaceIDUsageDescription: Pairr uses Face ID to lock the app and keep your pairing codes private.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.pairr
        PRODUCT_NAME: Pairr
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Pairr.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/PairrMac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© LRvdLinden"
    dependencies:
      - target: PairrWatch
        destinationFilters: [iOS]

  # Apple Watch — shows codes and QR codes, synced via iCloud.
  PairrWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PairrWatch
      - path: Shared
    info:
      path: Config/PairrWatch-Info.plist
      properties:
        CFBundleLocalizations: [en, nl, de, fr, es, it, sv, nb, da, pl]
        ITSAppUsesNonExemptEncryption: false
        PairrKeychainGroup: $(AppIdentifierPrefix)app.lrvdlinden.pairr.shared
        UIBackgroundModes: [remote-notification]
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.pairr.watchkitapp
        PRODUCT_NAME: PairrWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/PairrWatch.entitlements
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.lrvdlinden.pairr
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_WKApplication: YES
        SKIP_INSTALL: YES

schemes:
  Pairr:
    build:
      targets:
        Pairr: all
    run:
      config: Debug
    archive:
      config: Release
  PairrWatch:
    build:
      targets:
        PairrWatch: all
    run:
      config: Debug
